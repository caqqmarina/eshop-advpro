<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Payment List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1>Admin Payment List</h1>
    
    <div th:if="${payments.isEmpty()}" class="alert alert-info">
        No payments found.
    </div>
    
    <div th:if="${!payments.isEmpty()}">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.id}"></td>
                    <td th:text="${payment.method}"></td>
                    <td th:text="${payment.status}" th:class="${payment.status == 'SUCCESS' ? 'text-success' : 'text-danger'}"></td>
                    <td th:text="${payment.order.id}"></td>
                    <td th:text="${payment.order.author}"></td>
                    <td>
                        <a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}" 
                           class="btn btn-sm btn-primary">View Details</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <a th:href="@{/}" class="btn btn-secondary">Home</a>
</div>
</body>
</html>
