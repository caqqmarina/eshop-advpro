<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1>Order History for <span th:text="${authorName}"></span></h1>
    
    <div th:if="${orders.isEmpty()}" class="alert alert-info">
        No orders found for this name.
    </div>
    
    <div th:if="${!orders.isEmpty()}">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Products</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${#dates.format(new java.util.Date(order.orderTime), 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${order.status}"></td>
                    <td>
                        <ul>
                            <li th:each="product : ${order.products}" th:text="${product.productName}"></li>
                        </ul>
                    </td>
                    <td>
                        <a th:if="${order.status == 'WAITING_PAYMENT'}" th:href="@{/order/pay/{id}(id=${order.id})}" 
                           class="btn btn-sm btn-primary">Pay Now</a>
                        <span th:if="${order.status != 'WAITING_PAYMENT'}" th:text="${order.status}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <a th:href="@{/order/history}" class="btn btn-secondary">Back</a>
    <a th:href="@{/}" class="btn btn-secondary">Home</a>
</div>
</body>
</html>
