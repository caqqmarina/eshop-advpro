<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2>Create New Order</h2>
        
        <form th:action="@{/order/create}" method="post">
            <div class="form-group">
                <label for="authorInput">Your Name:</label>
                <input type="text" class="form-control" id="authorInput" name="author" required>
            </div>
            
            <div class="form-group">
                <label>Select Products:</label>
                <div class="form-check" th:each="product : ${products}">
                    <input class="form-check-input" type="checkbox" 
                           th:name="productIds" 
                           th:value="${product.productId}" 
                           th:id="${'product-' + product.productId}">
                    <label class="form-check-label" 
                           th:for="${'product-' + product.productId}"
                           th:text="${product.productName + ' (' + product.productQuantity + ')'}">
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">Create Order</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
