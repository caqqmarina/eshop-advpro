<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1>Payment Detail</h1>
    
    <div class="card mb-3">
        <div class="card-header">
            <h3>Payment Information</h3>
        </div>
        <div class="card-body">
            <p><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></p>
            <p><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
            <p><strong>Status:</strong> <span th:text="${payment.status}" th:class="${payment.status == 'SUCCESS' ? 'text-success' : 'text-danger'}"></span></p>
            
            <div th:if="${payment.method == 'Bank Transfer'}">
                <h4>Bank Transfer Details:</h4>
                <p><strong>Bank Name:</strong> <span th:text="${payment.paymentData.get('bankName')}"></span></p>
                <p><strong>Reference Code:</strong> <span th:text="${payment.paymentData.get('referenceCode')}"></span></p>
            </div>
            
            <div th:if="${payment.method == 'Voucher'}">
                <h4>Voucher Details:</h4>
                <p><strong>Voucher Code:</strong> <span th:text="${payment.paymentData.get('voucherCode')}"></span></p>
            </div>
        </div>
    </div>
    
    <div class="card mb-3">
        <div class="card-header">
            <h3>Order Information</h3>
        </div>
        <div class="card-body">
            <p><strong>Order ID:</strong> <span th:text="${payment.order.id}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${payment.order.author}"></span></p>
            <p><strong>Date:</strong> <span th:text="${#dates.format(new java.util.Date(payment.order.orderTime), 'dd-MM-yyyy HH:mm')}"></span></p>
            <p><strong>Status:</strong> <span th:text="${payment.order.status}"></span></p>
            
            <h4>Products:</h4>
            <ul>
                <li th:each="product : ${payment.order.products}" th:text="${product.productName}"></li>
            </ul>
        </div>
    </div>
    
    <a th:href="@{/payment/detail}" class="btn btn-secondary">Back</a>
    <a th:href="@{/}" class="btn btn-secondary">Home</a>
</div>
</body>
</html>
