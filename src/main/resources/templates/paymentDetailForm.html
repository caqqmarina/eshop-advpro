<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1>View Payment Detail</h1>
    
    <form th:action="@{/payment/detail}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" id="paymentId" name="paymentId" th:value="${paymentId}" placeholder="Enter Payment ID" required>
            <button type="submit" class="btn btn-primary">View</button>
        </div>
    </form>
    
    <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
</div>
</body>
</html>
