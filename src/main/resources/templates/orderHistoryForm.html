<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1>View Order History</h1>
    
    <form th:action="@{/order/history}" method="post">
        <div class="mb-3">
            <label for="authorName" class="form-label">Enter Your Name:</label>
            <input type="text" class="form-control" id="authorName" name="authorName" th:value="${authorName}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">View Orders</button>
        <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
    </form>
</div>
</body>
</html>
