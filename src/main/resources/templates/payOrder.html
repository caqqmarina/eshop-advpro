<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function showPaymentForm() {
            var method = document.getElementById('paymentMethod').value;
            document.getElementById('bankTransferForm').style.display = 'none';
            document.getElementById('voucherForm').style.display = 'none';
            
            if (method === 'Bank Transfer') {
                document.getElementById('bankTransferForm').style.display = 'block';
            } else if (method === 'Voucher') {
                document.getElementById('voucherForm').style.display = 'block';
            }
        }
    </script>
</head>
<body>
<div class="container my-5">
    <h1>Pay Order</h1>
    
    <div class="card mb-3">
        <div class="card-header">
            <h3>Order Details</h3>
        </div>
        <div class="card-body">
            <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${order.author}"></span></p>
            <p><strong>Date:</strong> <span th:text="${#dates.format(new java.util.Date(order.orderTime), 'dd-MM-yyyy HH:mm')}"></span></p>
            <p><strong>Status:</strong> <span th:text="${order.status}"></span></p>
            
            <h4>Products:</h4>
            <ul>
                <li th:each="product : ${order.products}" th:text="${product.productName}"></li>
            </ul>
        </div>
    </div>
    
    <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
        <div class="mb-3">
            <label for="paymentMethod" class="form-label">Payment Method:</label>
            <select class="form-select" id="paymentMethod" name="paymentMethod" onchange="showPaymentForm()" required>
                <option value="">-- Select Payment Method --</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Voucher">Voucher Code</option>
            </select>
        </div>
        
        <div id="bankTransferForm" style="display:none;">
            <div class="mb-3">
                <label for="bankName" class="form-label">Bank Name:</label>
                <input type="text" class="form-control" id="bankName" name="bankName">
            </div>
            <div class="mb-3">
                <label for="referenceCode" class="form-label">Reference Code:</label>
                <input type="text" class="form-control" id="referenceCode" name="referenceCode">
            </div>
        </div>
        
        <div id="voucherForm" style="display:none;">
            <div class="mb-3">
                <label for="voucherCode" class="form-label">Voucher Code:</label>
                <input type="text" class="form-control" id="voucherCode" name="voucherCode">
                <small class="text-muted">Format: ESHOP followed by 16 characters with 8 digits (e.g., ESHOP12345678ABCD)</small>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Submit Payment</button>
        <a th:href="@{/order/history}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
